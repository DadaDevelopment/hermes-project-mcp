name: project-mcp
version: 0.2.0
description: >
  Per-project MCP servers (Claude Code style): a project directory defines its
  own MCP servers via .hermes/mcp.json, .mcp.json or .claude/settings*.json.
  Sessions working in that project get those servers through the native MCP
  pipeline, without touching global config or restarting the gateway.
  Chat-managed via project_mcp_* tools.
author: DadaDevelopment
kind: standalone
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - project_mcp_sync
  - project_mcp_status
  - project_mcp_add
  - project_mcp_remove
